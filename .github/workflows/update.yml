name: Update news

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分（UTC基準・1時間ごと）
  workflow_dispatch:        # Actions タブの「Run workflow」で手動実行もできる
  push:
    branches: [main]
    paths: ["scripts/**"]   # 設定を変えたらすぐ反映

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python scripts/fetch_news.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update news $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
