<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trend News</title>
<meta name="description" content="IT・世界情勢・経済・科学のトレンドを1時間ごとに自動収集（芸能ニュースなし）">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d9480f'/><path d='M7 22l6-7 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1c1a; --sub:#6b6a65; --line:#e6e4dd;
  --accent:#d9480f; --chip:#efede6;
  --it:#2f6fdb; --world:#c2410c; --economy:#15803d; --science:#7c3aed;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121314; --card:#1b1c1e; --ink:#ececea; --sub:#9a9a96; --line:#2a2b2e;
    --accent:#ff7a45; --chip:#25262a; --it:#6ea0ff; --world:#ff8a5c; --economy:#4ade80; --science:#b794ff; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;padding-top:calc(10px + env(safe-area-inset-top))}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
#updated{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--sub);font:inherit;font-weight:600;
  padding:6px 12px;border-radius:999px;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}

section.trends{padding:16px 0 4px}
.label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:0 0 8px;display:flex;justify-content:space-between}
.label button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;
  padding:5px 11px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600}
.chip i{font-style:normal;font-size:11px;color:var(--sub)}
.chip .rank{font-size:11px;font-weight:700;color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed=true] i,.chip[aria-pressed=true] .rank{color:#fff}

.tools{display:flex;gap:8px;padding:14px 0 6px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:0 10px}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:9px 0;outline:none;min-width:0}
.toggle{flex:none;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px;white-space:nowrap}
.toggle input{accent-color:var(--accent)}

#count{font-size:12px;color:var(--sub);margin:6px 0 2px}
ul.list{list-style:none;margin:0;padding:0}
.item{border-bottom:1px solid var(--line)}
.item a{display:block;padding:13px 0}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.cat{font-weight:600}
.title{font-size:16px;font-weight:600;line-height:1.45;margin:0}
.item a:active .title{color:var(--accent)}
.sum{font-size:13px;color:var(--sub);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hot{color:var(--accent);font-weight:700}
.en{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:2px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
#more{display:block;width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;border-radius:12px;cursor:pointer}
footer{font-size:12px;color:var(--sub);padding:24px 0 40px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><h1>Trend<span>News</span></h1><span id="updated">読み込み中…</span></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="wrap">
  <section class="trends">
    <p class="label"><span>いまのトレンドワード（24時間）</span><button id="clear" hidden>解除</button></p>
    <div class="chips" id="chips"></div>
  </section>

  <div class="tools">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="キーワードで絞り込み" autocomplete="off">
    </label>
    <label class="toggle"><input type="checkbox" id="en" checked>英語</label>
  </div>

  <p id="count"></p>
  <ul class="list" id="list"></ul>
  <button id="more" hidden>もっと見る</button>
</main>

<footer class="wrap">芸能ニュースは除外しています · 1時間ごとに自動更新<br>各記事の権利は配信元に帰属します</footer>

<script>
const PAGE = 40;
const state = { cat: "all", word: "", q: "", en: true, shown: PAGE };
let DATA = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "たった今";
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  return h < 24 ? `${h}時間前` : `${Math.round(h / 24)}日前`;
}

function highlight(text, terms) {
  let out = esc(text);
  for (const t of terms) {
    if (!t) continue;
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    out = out.replace(re, (m) => `<mark>${m}</mark>`);
  }
  return out;
}

function matches(a) {
  if (state.cat !== "all" && a.category !== state.cat) return false;
  if (!state.en && a.lang === "en") return false;
  const hay = (a.title + " " + (a.summary || "")).toLowerCase();
  if (state.word && !hay.includes(state.word.toLowerCase())) return false;
  if (state.q && !state.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))) return false;
  return true;
}

function renderTabs() {
  const cats = [["all", "すべて"], ...Object.entries(DATA.categories)];
  $("tabs").innerHTML = cats.map(([k, v]) =>
    `<button class="tab" role="tab" data-cat="${k}" aria-selected="${state.cat === k}">${v}</button>`).join("");
}

function renderChips() {
  const list = DATA.trends.filter((t) => state.cat === "all" || t.category === state.cat);
  $("chips").innerHTML = list.length ? list.map((t, i) =>
    `<button class="chip" data-word="${esc(t.word)}" aria-pressed="${state.word === t.word}">
       <span class="rank">${i + 1}</span><b>${esc(t.word)}</b><i>${t.count}</i></button>`).join("")
    : `<span class="toggle">このカテゴリはまだデータが少なめです</span>`;
  $("clear").hidden = !state.word;
}

function renderList() {
  const items = DATA.articles.filter(matches);
  const terms = [state.word, ...state.q.split(/\s+/)];
  $("count").textContent = `${items.length}件` + (state.word ? ` ·「${state.word}」` : "");
  $("list").innerHTML = items.slice(0, state.shown).map((a) => {
    const color = `var(--${a.category})`;
    return `<li class="item"><a href="${esc(a.link)}" target="_blank" rel="noopener">
      <div class="meta"><span class="dot" style="background:${color}"></span>
        <span class="cat" style="color:${color}">${esc(DATA.categories[a.category] || "")}</span>
        <span>${esc(a.source)}</span><span>${ago(a.date)}</span>
        ${a.lang === "en" ? '<span class="en">EN</span>' : ""}
        ${a.score >= 50 ? `<span class="hot">🔥${a.score}</span>` : ""}</div>
      <p class="title">${highlight(a.title, terms)}</p>
      ${a.summary && a.summary !== a.title ? `<p class="sum">${esc(a.summary)}</p>` : ""}
    </a></li>`;
  }).join("") || `<li class="empty">該当する記事がありません</li>`;
  $("more").hidden = items.length <= state.shown;
}

function render() { renderTabs(); renderChips(); renderList(); }

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.cat = b.dataset.cat; state.word = ""; state.shown = PAGE; render();
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.word = state.word === b.dataset.word ? "" : b.dataset.word; state.shown = PAGE;
  renderChips(); renderList(); window.scrollTo({ top: 0, behavior: "smooth" });
});
$("clear").onclick = () => { state.word = ""; renderChips(); renderList(); };
$("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.shown = PAGE; renderList(); });
$("en").addEventListener("change", (e) => { state.en = e.target.checked; renderList(); });
$("more").onclick = () => { state.shown += PAGE; renderList(); };

fetch("data.json?t=" + Date.now())
  .then((r) => r.json())
  .then((d) => {
    DATA = d;
    const u = new Date(d.updated);
    $("updated").textContent = `${u.getMonth() + 1}/${u.getDate()} ${String(u.getHours()).padStart(2,"0")}:${String(u.getMinutes()).padStart(2,"0")} 更新`;
    render();
  })
  .catch(() => { $("updated").textContent = ""; $("list").innerHTML = '<li class="empty">データを読み込めませんでした。少し待ってから再読み込みしてください。</li>'; });
</script>
</body>
</html>
